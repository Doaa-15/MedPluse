name: reminder
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  equatable: ^2.0.8
  hive_flutter: ^1.1.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  uuid: ^4.5.3
  supabase_flutter: ^2.0.0
  image_picker: ^1.1.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  flutter_timezone: ^3.0.0
  hive: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true 
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png" 
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"